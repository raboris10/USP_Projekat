<!-- Prekidač teme i na stranici za prijavu (u zaglavlju je isti) -->
<button type="button" class="tema" (click)="temaService.promeni()">
  {{ temaService.tema() === 'tamna' ? 'Svetla tema' : 'Tamna tema' }}
</button>

<main class="strana">

  <!-- Leva strana: naziv i kratak opis aplikacije -->
  <section class="uvod">
    <h1>ConsultMe</h1>
    <p class="podnaslov">Jednostavno zakazivanje konsultacija</p>
  </section>

  <!-- Desna strana: forma za prijavu -->
  <section class="kartica">
    <h2>Prijava</h2>

    <!-- (ngSubmit) -> poziva prijaviSe() na klik dugmeta ili Enter -->
    <form (ngSubmit)="prijaviSe()">
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email"
               autocomplete="username" placeholder="ime.prezime&#64;fakultet.rs" />
      </label>

      <label>
        Lozinka
        <input type="password" name="lozinka" [(ngModel)]="lozinka"
               autocomplete="current-password" />
      </label>

      <!-- greška se prikazuje samo ako postoji -->
      @if (greska()) {
        <p class="greska" role="alert">{{ greska() }}</p>
      }

      <button type="submit" [disabled]="ucitavanje()">
        {{ ucitavanje() ? 'Prijavljivanje...' : 'Prijavi se' }}
      </button>
    </form>

    <!-- Test nalozi iz db/init.sql (po jedan za svaku ulogu). Ukloniti pre pilota! -->
    <details class="test-nalozi">
      <summary>Test nalozi</summary>
      <table>
        <tr><td>Administrator</td><td>admin&#64;consultme.rs</td><td>admin123</td></tr>
        <tr><td>Profesor</td><td>zoran.zoranic&#64;fakultet.rs</td><td>lozinka123</td></tr>
        <tr><td>Student</td><td>ana.anic&#64;fakultet.rs</td><td>lozinka123</td></tr>
      </table>
    </details>
  </section>

</main>
