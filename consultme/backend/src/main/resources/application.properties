spring.application.name=consultme
server.port=8080

# ---------------------------------------------------------------------
# Konekcija na bazu
# ${IME:podrazumevano} -> čita promenljivu okruženja IME; ako ne postoji, koristi "podrazumevano".
# U Docker-u vrednosti stižu iz docker-compose.yml (DB_HOST=db, DB_PORT=3306).
# Podrazumevane vrednosti važe za pokretanje iz Eclipse-a na Docker bazu (localhost:8089).
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:8089}/${DB_NAME:consultme_db}?allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:consultme}
spring.datasource.password=${DB_PASSWORD:consultme123}

# Tabele pravi db/init.sql, Hibernate ih ne dira
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# JWT
# tajni-kljuc: bar 32 znaka; pravi ključ je u .env (JWT_SECRET)
# trajanje-minuta: posle koliko minuta token ističe i korisnik mora ponovo da se prijavi
# ---------------------------------------------------------------------
jwt.tajni-kljuc=${JWT_SECRET:ovo-je-samo-razvojni-kljuc-promenite-ga-u-env-fajlu}
jwt.trajanje-minuta=${JWT_TRAJANJE_MINUTA:120}

# ---------------------------------------------------------------------
# Pravila za rezervacije
# najvise-aktivnih: koliko aktivnih rezervacija (za termine koji tek dolaze) student sme da ima odjednom
#                   (smanjuje gužvu pred ispitne rokove)
# otkazivanje-sati-pre: najkasnije koliko sati pre termina student sme da otkaže rezervaciju
# ---------------------------------------------------------------------
rezervacije.najvise-aktivnih=${REZERVACIJE_NAJVISE_AKTIVNIH:3}
rezervacije.otkazivanje-sati-pre=${REZERVACIJE_OTKAZIVANJE_SATI_PRE:2}

# ---------------------------------------------------------------------
# Automatski podsetnici (24h, 12h i 2h pre termina)
# interval-ms: na koliko milisekundi se proverava da li treba poslati podsetnike
#              300000 = 5 minuta; za testiranje se može smanjiti, npr. na 30000 (30 sekundi)
# ---------------------------------------------------------------------
podsetnici.interval-ms=${PODSETNICI_INTERVAL_MS:300000}
