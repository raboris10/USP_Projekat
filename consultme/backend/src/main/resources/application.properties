spring.application.name=consultme

# --- MySQL ---
# Lokalno (Eclipse): localhost:3306, root/strahinja123
# U Docker-u: DB_HOST=db, DB_PORT=3306, DB_NAME=consultme, DB_USER/DB_PASSWORD iz .env
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:consultme}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:strahinja123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# --- JWT ---
consultme.jwt.secret=${JWT_SECRET:promeni-ovaj-tajni-kljuc-pre-produkcije-1234567890}
consultme.jwt.trajanje-minuta=${JWT_TRAJANJE_MINUTA:120}

# --- prvi administrator ---
consultme.admin.email=admin@consultme.rs
consultme.admin.lozinka=admin123
logging.level.org.springframework.security=DEBUG